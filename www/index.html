<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1 id="title">วันสำคัญ</h1></header>
  <main>
    <section id="view-list"><div id="list"></div></section>
    <section id="view-cal" hidden>
      <div class="calbar">
        <button id="prev" type="button" aria-label="เดือนก่อน"><span data-i="left"></span></button>
        <strong id="monthlabel"></strong>
        <button id="next" type="button" aria-label="เดือนถัดไป"><span data-i="right"></span></button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="dayevents"></div>
      <div id="monthhol"></div>
    </section>
    <pre id="err"></pre>
  </main>
  <button id="fab" type="button" aria-label="เพิ่ม"><span data-i="plus"></span></button>
  <nav>
    <button id="tab-list" class="on" type="button"><span data-i="list"></span><span>รายการ</span></button>
    <button id="tab-cal" type="button"><span data-i="calendar"></span><span>ปฏิทิน</span></button>
  </nav>
  <div id="sheet" class="overlay" hidden>
    <div class="panel">
      <h2 id="sheettitle">เพิ่มวันสำคัญ</h2>
      <label>ชื่อ<input id="f-name" type="text" placeholder="เช่น สอบปลายภาค"></label>
      <label>วันที่<input id="f-date" type="date"></label>
      <label>โน้ต<textarea id="f-note" rows="2"></textarea></label>
      <div id="photobox"></div>
      <button id="photobtn" type="button" class="ghost"></button>
      <input id="f-photo" type="file" accept="image/*" hidden>
      <p id="formerr" class="error"></p>
      <div class="row">
        <button id="cancel" type="button" class="ghost">ยกเลิก</button>
        <button id="save" type="button">บันทึก</button>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener("error", function (e) {
      document.getElementById("err").textContent += e.message + " (" + e.filename + ":" + e.lineno + ")\n";
    });
    window.addEventListener("unhandledrejection", function (e) {
      document.getElementById("err").textContent += "Promise: " + e.reason + "\n";
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
